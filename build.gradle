/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    id 'java-library'
    id 'maven-publish'
}

repositories {
    mavenLocal()
    maven {
        url = uri('https://repo.maven.apache.org/maven2/')
    }
}

dependencies {
    api libs.org.springframework.boot.spring.boot.starter.web
    api libs.org.mockito.mockito.core
    api libs.org.springframework.boot.spring.boot.starter.data.jpa
    api libs.org.mapstruct.mapstruct
    api libs.org.mapstruct.mapstruct.processor
    api libs.org.springdoc.springdoc.openapi.starter.webmvc.ui
    api libs.org.springframework.boot.spring.boot.starter.data.mongodb
    api libs.io.micrometer.micrometer.tracing.bridge.brave
    api libs.org.springframework.boot.spring.boot.starter.graphql
    api libs.com.graphql.java.graphql.java.extended.scalars
    runtimeOnly libs.com.h2database.h2
    runtimeOnly libs.org.postgresql.postgresql
    runtimeOnly libs.com.mysql.mysql.connector.j
    testImplementation libs.org.springframework.boot.spring.boot.starter.test
    testImplementation libs.org.junit.jupiter.junit.jupiter.engine
    testImplementation libs.org.junit.jupiter.junit.jupiter.api
    testImplementation libs.org.junit.jupiter.junit.jupiter.params
    testImplementation libs.org.junit.vintage.junit.vintage.engine
    testImplementation libs.org.junit.platform.junit.platform.launcher
    testImplementation libs.org.springframework.graphql.spring.graphql.test
    compileOnly libs.org.projectlombok.lombok
    annotationProcessor libs.org.projectlombok.lombok
    testImplementation libs.org.springframework.restdocs.spring.restdocs.mockmvc
    testImplementation libs.org.springframework.restdocs.spring.restdocs.webtestclient
}

group = 'com.retailer'
version = '0.0.1-SNAPSHOT'
description = 'reward-program'
java.sourceCompatibility = JavaVersion.VERSION_17

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
}
